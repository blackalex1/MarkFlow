<div id="top-bar" class="top-bar hidden">
    <div id="breadcrumb" class="breadcrumb"></div>
    <div class="actions">
        <div class="header-actions">
            {% if user_role in ['developer', 'maintainer', 'owner'] %}
            <label class="visibility-toggle" title="Public Visibility">
                <input type="checkbox" id="visibility-checkbox">
                <span class="slider"></span>
                <i data-lucide="eye" class="icon-xs"></i>
            </label>
            <div class="custom-dropdown" id="status-dropdown">
                <div class="dropdown-trigger">
                    <span id="current-status-text" data-t="status_draft">Draft</span>
                    <i data-lucide="chevron-down" class="select-arrow"></i>
                </div>
                <div class="dropdown-menu hidden">
                    <div class="dropdown-item" data-value="draft" data-t="status_draft">Draft</div>
                    <div class="dropdown-item" data-value="in_progress" data-t="status_in_progress">In Progress</div>
                    <div class="dropdown-item" data-value="published" data-t="status_published">Published</div>
                </div>
            </div>
            <button id="btn-edit" class="btn-icon" data-t-title="btn_edit">
                <i data-lucide="edit-3" class="icon-sm"></i>
            </button>
            <button id="btn-save" class="btn-primary hidden" data-t="btn_save">Save</button>
            <button id="btn-cancel" class="btn-secondary hidden" data-t="btn_cancel">Cancel</button>
            <button id="btn-delete" class="btn-icon btn-danger-hover" data-t-title="btn_delete">
                <i data-lucide="trash-2" class="icon-sm"></i>
            </button>
            {% endif %}
        </div>
    </div>
</div>
