<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.app_name }}</title>
    <link rel="icon" href="{{ config.favicon_path if config.favicon_path else 'data:,' }}">
    <link rel="stylesheet" href="/static/css/style.css?v={{ app_version }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="/static/vendor/js/lucide.min.js"></script>
    
    <!-- Highlight.js for Code Highlighting -->
    <link id="hljs-theme" rel="stylesheet" href="/static/vendor/css/github-dark.min.css">
    <script src="/static/vendor/js/highlight.min.js"></script>
    <script src="/static/vendor/js/languages/scala.min.js"></script>
    <script src="/static/vendor/js/languages/sql.min.js"></script>
    <script src="/static/vendor/js/languages/java.min.js"></script>
    <script src="/static/vendor/js/languages/r.min.js"></script>
    
    <script src="/static/vendor/js/marked.min.js"></script>
    <script src="/static/vendor/js/purify.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/static/vendor/js/mermaid.min.js"></script>
    
    <!-- Local Editor Assets (Bundled CodeMirror) -->
    <link rel="stylesheet" href="/static/vendor/css/easymde.min.css">
    <script src="/static/vendor/js/easymde.min.js"></script>
    
    <!-- KaTeX for Mathematics -->
    <link rel="stylesheet" href="/static/vendor/css/katex.min.css">
    <script src="/static/vendor/js/katex.min.js"></script>
    <script src="/static/vendor/js/auto-render.min.js"></script>
    <script>window.APP_VERSION = "{{ app_version }}";</script>
    <link rel="stylesheet" href="/static/css/editor/markflow-editor.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/css/modules/color-picker.css?v={{ app_version }}">
    
    <!-- Custom Accent Color -->
    <style id="custom-theme-vars">
        :root {
            --primary-color: {{ config.primary_color if config.primary_color else '#6366f1' }};
            --primary-rgb: {{ config.primary_rgb if config.primary_rgb else '99, 102, 241' }};
        }
    </style>
</head>
