<div id="confirm-modal" class="modal-overlay hidden" style="z-index: 1000000;">
    <div class="modal-content modal-sm animate-pop">
        <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">
            <h3 id="confirm-title" style="font-size: 18px; font-weight: 700; color: var(--text-main);">Confirm Action</h3>
        </div>
        <div class="modal-body" style="padding-top: 10px;">
            <p id="confirm-message" style="color: var(--text-muted); font-size: 14px; line-height: 1.6;">Are you sure you want to proceed?</p>
        </div>
        <div class="modal-footer" style="border-top: none; gap: 12px; padding-top: 20px; display: flex; flex-direction: row; align-items: center;">
            <button id="confirm-btn-no" class="btn btn-secondary" style="flex: 1; margin: 0; border: 1px solid var(--primary-color); color: var(--primary-color); background: transparent;">Cancel</button>
            <button id="confirm-btn-yes" class="btn btn-primary" style="flex: 1; margin: 0; background: #ef4444; border-color: #ef4444; color: #fff;">Confirm</button>
        </div>
    </div>
</div>
